<!-- Main container -->
<div class="bp-file-explorer-container">
  <!-- Top toolbar -->
  <div class="bp-file-explorer-toolbar">
    <div class="bp-file-explorer-toolbar-buttons">

      <button title="Toggle File Tree" class="bp-file-explorer-btn toggle-tree"><i
          class="fa-duotone fa-regular fa-folder-tree"></i></button>

      <button title="Upload Files" class="bp-file-explorer-btn upload-files"><i
          class="fa-duotone fa-regular fa-upload"></i></button>
      <button title="Upload Directory" class="bp-file-explorer-btn upload-directory"><i
          class="fa-duotone fa-regular fa-folder-arrow-up"></i></button>
      <button title="Refresh File Tree" class="bp-file-explorer-btn refresh-files"><i
          class="fa-duotone fa-regular fa-arrows-rotate"></i></button>

      <!--
      <button class="bp-file-explorer-btn">Back</button>
      <button class="bp-file-explorer-btn">Forward</button>
      <button class="bp-file-explorer-btn">Up</button>
      -->

    </div>
    <div class="bp-file-explorer-address">
      <span>Address:</span>
      <input type="text" class="bp-file-explorer-address-input" value="Loading..." />
    </div>
  </div>

  <!-- Main content area -->
  <div class="bp-file-explorer-content">
    <!-- Left sidebar with file tree -->
    <div class="bp-file-explorer-sidebar">
      <!-- Placeholder for your FileTree component -->
      <div class="bp-file-explorer-tree" id="jtree">
        Loading...
      </div>
    </div>

    <!-- Right content area -->
    <div class="bp-file-explorer-main">
      <!-- Content header -->
      <div class="bp-file-explorer-header">
        <div class="bp-file-explorer-column">Name</div>
        <div class="bp-file-explorer-column">Size</div>
        <div class="bp-file-explorer-column">Type</div>
        <div class="bp-file-explorer-column">Modified</div>
      </div>
      <div class="bp-file-explorer-update-overlay">
        <h1>Updating</h1>
        <div class="spinner"></div>
      </div>
      <!-- Content area -->
      <!-- Drag to Upload Indicator (initially hidden) 
      <div class="bp-file-explorer-drag-upload desktop-overlay">
        <p class="upload-message">Drag and Dropping to Upload files or folders</p>

        <div class="storage-used">
          <p>Storage Used: <span class="storageUsed">loading...</span></p>
          <p>Remaining: <span class="storageRemaining">loading...</span></p>
        </div>
      </div>
      -->

      <div class="bp-file-explorer-files">

        <!-- Example items (you can remove these) -->
        <div class="bp-file-explorer-item">
          <div class="bp-file-explorer-column">Loading...</div>
          <div class="bp-file-explorer-column">--</div>
          <div class="bp-file-explorer-column">--</div>
          <div class="bp-file-explorer-column">--</div>
        </div>
      </div>
      <div class="bp-file-explorer-file-viewer">
        <div class="bp-file-explorer-file-viewer-header">
        </div>
        <div class="bp-file-explorer-file-viewer-content">
          <iframe class="bp-file-explorer-file-viewer-iframe"></iframe>
          <div class="bp-file-explorer-file-viewer-editor"></div>
        </div>
      </div>
    </div>

    <!-- Status bar -->
  </div>

  <div class="bp-file-explorer-statusbar">
    <!--TODO: file metadata in bottom status bar
      <span>
        1 file selected
      </span>
      <span>
        2 mb
      </span>
    -->
    <div class="float_right usage-stats">
      <span>Storage Used: </span>
      <span class="bp-file-explorer-quota-used storageUsed">2.1 GB</span>
      <span> of </span>
      <span class="bp-file-explorer-quota-total storageRemaining">10 GB</span>
    </div>

  </div>

  <div class="bp-file-explorer-upload-overlay desktop-overlay">
    <div class="bp-file-explorer-upload-container">
      <!-- Header -->
      <div class="bp-file-explorer-upload-header">
        <h2>Upload Files</h2>
        <div class="bp-file-explorer-upload-quota">
          <span>Storage Used: </span>
          <span class="bp-file-explorer-quota-used storageUsed">2.1 GB</span>
          <span> of </span>
          <span class="bp-file-explorer-quota-total storageRemaining">10 GB</span>
        </div>
      </div>

      <!-- Upload Errors -->
      <div class="bp-file-explorer-upload-errors">
      </div>



      <!-- File List -->
      <div class="bp-file-explorer-upload-files">
        <div class="bp-file-explorer-upload-files-header">
          <div class="bp-file-explorer-upload-column-name">Name</div>
          <div class="bp-file-explorer-upload-column-size">Size</div>
          <div class="bp-file-explorer-upload-column-status">Status</div>
        </div>
        <div class="bp-file-explorer-upload-files-list">
          <!-- Files will be inserted here by JavaScript -->
        </div>
      </div>

      <!-- Total Size -->
      <div class="bp-file-explorer-upload-total">
        Total Size: <span class="bp-file-explorer-total-size">0 MB</span><br />
        Available Storage: <span class="bp-file-explorer-total-size storageRemaining">0 MB</span>
        <div class="bp-file-explorer-storage-warning error">Warning: This upload will exceed your storage limit.</div>
      </div>

      <!-- Controls -->
      <!-- Controls -->
      <div class="bp-file-explorer-upload-controls">
        <div class="bp-file-explorer-tos">
          <label for="bp-tos-agreement" title="You clicked the checkbox during account registration.">I have previously
            agreed to and read BuddyPond's <a href="tos" target="_blank">Terms of Service</a>.</label>
          <input type="checkbox" id="bp-tos-agreement" class="bp-tos-agreement" checked disabled>
        </div>
        <button class="bp-file-explorer-btn bp-file-explorer-upload-cancel">Cancel</button>
        <button class="bp-file-explorer-btn bp-file-explorer-upload-start">Upload</button>
      </div>


      <!-- Progress Bar (hidden initially) -->
      <div class="bp-file-explorer-upload-progress-container" style="display: none;">
        <div class="bp-file-explorer-upload-progress-info">
          <span class="bp-file-explorer-current-file">filename.txt</span>
          <span class="bp-file-explorer-file-count">(File 1 of 5)</span>
        </div>
        <div class="bp-file-explorer-upload-progress-bar-container">
          <div class="bp-file-explorer-upload-progress-bar" style="width: 0%"></div>
        </div>
        <div class="bp-file-explorer-upload-progress-percentage">0%</div>
      </div>
    </div>



  </div>
